<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>AttendWise</title>
    <!-- Warm the Supabase connection early so the first data query isn't waiting
         on DNS/TLS. Fonts are now self-hosted (see main.tsx), so no third-party
         font CDN handshake on the critical path. -->
    <link rel="preconnect" href="https://jlueyxbqknnmcoesgnmg.supabase.co" crossorigin />
    <script type="text/javascript">
      // Apply the saved theme before first paint so there's no light flash.
      ;(function () {
        try {
          var t = localStorage.getItem("attendwise_theme") || "light"
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch (e) {}
      })()
    </script>
    <script type="text/javascript">
      // Decodes the path GitHub Pages' 404.html re-encoded into the query
      // string, restoring the real URL so React Router sees the right route.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
