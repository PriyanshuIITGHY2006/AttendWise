name: Website

on:
  push:
    branches: [v2-native]
    paths: ['site/**', 'web/**', 'webapp/**', 'CHANGELOG.md', '.github/scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the pages written in Markdown
        run: python3 .github/scripts/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Web app tests
        working-directory: webapp
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build the web app
        working-directory: webapp
        env:
          APP_BASE: /AttendWise/app/
        run: |
          npm run build
          rm -rf ../site/app
          mkdir -p ../site/app
          cp -r dist/. ../site/app/
      - run: |
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
