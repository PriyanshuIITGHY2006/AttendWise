name: CI

on:
  push:
    branches: [v2-native, dev]
    paths-ignore:
      - 'site/**'
      - '**.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'site/**'
      - '**.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Attendance rules (unit tests)
        run: ./gradlew -p domain test

      - name: Unpack release signing key
        if: env.SIGNING_KEY != ''
        run: |
          mkdir -p app/signing
          echo "$SIGNING_KEY" | base64 -d | tar -xz -C app/signing

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AttendWise-test-${{ github.run_number }}.apk
          if [ -n "$SIGNING_KEY" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/AttendWise-${{ github.run_number }}.apk
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-test-report
          path: domain/build/reports/tests/test
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2-native'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: AttendWise v2 build ${{ github.run_number }}
          prerelease: true
          body: |
            Test build from `${{ github.sha }}`.

            - `AttendWise-${{ github.run_number }}.apk`: the real app (only present once the release signing key is set up).
            - `AttendWise-test-${{ github.run_number }}.apk`: a test build that installs next to it as "AttendWise" with a `.debug` package.
          files: out/*.apk
